tools:
- name: find_tensorfeed_data
  description: Discover which TensorFeed endpoint answers a data need. Describe what you want in plain
    language (e.g. "trending AI papers", "is OpenAI down", "model price history") and this returns the
    2 to 3 best-matching TensorFeed endpoints, each with its HTTP path, what it returns, and whether it
    is free or paid. TensorFeed exposes 100+ AI-ecosystem data and signed-verdict endpoints; the core
    ones are also dedicated tools, but the full catalog is reachable here and callable over HTTP (paid
    ones via x402 or a credits token). On this server it also matches tools that are callable by name
    but not listed (openFDA, EIA energy series, SEC company submissions, and more). Free, no auth. Use
    this first when no dedicated tool obviously fits.
- name: get_news_articles
  description: Get the latest AI news articles aggregated from 12+ sources (Anthropic, OpenAI, Google,
    HuggingFace, TechCrunch, The Verge, Hacker News, etc). Polled every 10 min, deduplicated, sanitized
    for prompt injection. Returns up to 200 articles with title, snippet, source, and publishedAt.
- name: get_status_summary
  description: Get the live operational status of every major AI service tracked by TensorFeed (Claude,
    ChatGPT, Gemini, Perplexity, Cohere, Mistral, HuggingFace, Replicate, Midjourney, etc). Polled every
    2 min. Returns operational | degraded | down | unknown per service, with the time each was last checked.
    Per-component detail is on /api/status.
- name: get_models
  description: Get the model pricing and specs catalog across providers (Anthropic, OpenAI, Google, Meta,
    Mistral, Cohere, etc). Includes per-token pricing, context windows, capabilities, deprecation flags.
    Refreshed daily.
- name: get_cve_record
  description: 'Look up a single CVE Record v5.2 from the MITRE CVE List by ID (e.g. CVE-2024-3094). Lazy-fetched
    and cached 7 days. License: MITRE CVE Terms of Use, commercial redistribution permitted; the response
    includes the standard attribution block.'
- name: get_kev_catalog
  description: 'Get the CISA Known Exploited Vulnerabilities (KEV) catalog. Returns the most recent N
    entries plus catalog metadata. Refreshed daily at 06:30 UTC. License: US Government public domain.
    ~1500 actively-exploited CVEs.'
- name: get_epss_score
  description: 'Get the EPSS (Exploit Prediction Scoring System) probability for one CVE, sourced from
    FIRST.org. Returns the daily probability (0-1) that the CVE will be exploited in the next 30 days
    plus a percentile rank. License: FIRST.org free-for-any-use.'
- name: get_osv_advisory_for_package
  description: 'Cross-ecosystem vulnerability advisory lookup via OSV.dev. Given an ecosystem (PyPI, npm,
    Go, crates.io, Maven, NuGet, RubyGems, Packagist, etc) and a package name (optional version), returns
    advisories affecting that package. License: Apache 2.0.'
- name: check_ai_supply_chain_risk
  description: 'Check the TensorFeed AI/MCP/LLM supply-chain IOC feed. Returns publicly-disclosed malicious
    npm/PyPI packages whose name or summary signals relevance to AI agent operators. With no args, returns
    the whole snapshot (typically a small number of entries). With "package_name", returns only entries
    matching that name (substring, case-insensitive) so an agent can ask "is X risky right now?" before
    installing. Each entry cites its GHSA primary source. Posture: TF republishes already-public advisories;
    the listed primary source is authoritative.'
- name: check_agent_reputation
  description: 'Look up an agent''s public reputation card from the TensorFeed Agent Reputation Bureau.
    Takes a wallet (0x + 40 hex) OR a token_prefix (first 16 chars of a tf_live_ bearer). Returns the
    full ReputationCard: composite + sub-metric ranks (reliability, spend, activity, streak), trust grade
    A through F, public flags (new_wallet, spend_spike, claim_disputed, etc), wallet age, first_seen,
    last_active, ofac_clean, banned + ban_reason if applicable. Cards rebuild daily at 04:50 UTC from
    TF''s own observable telemetry. Returns ok=false with status=not_found for unknown identities so callers
    can distinguish "we have no record" from "we have a record showing zero activity". Useful for: marketplaces
    routing work to high-grade agents, peer agents deciding to trust another agent, ops dashboards monitoring
    an agent''s standing, or operators inspecting their own reputation before claiming a wallet.'
- name: submit_wantlist_item
  description: Submit a wantlist entry telling TensorFeed what data you wish was served. Aggregated patterns
    inform TF's pipeline priorities. Anonymous by default, no PII collected, items expire after 30 days.
    Per-IP rate limit 5 submissions per 24h. Signal collector, not a contract.
- name: register_free_watch
  description: Register a free webhook subscription. TensorFeed POSTs HMAC-signed deliveries to your callback_url
    when the watch spec fires (price drop, status change, leaderboard rank shift, macro indicator threshold
    crossing, etc). 5 watches per IP, 25 fires per watch, 30-day TTL. Same delivery infrastructure as
    paid /api/premium/watches. If you omit secret, TensorFeed generates one and returns it; you cannot
    retrieve it again later. Same IP for management; manage via the REST endpoints under /api/watches/free/{id}.
- name: search_sec_edgar
  description: 'Lucene-style full-text search across the entire SEC EDGAR public-filings corpus since
    the 1990s. Forms include 10-K (annual), 10-Q (quarterly), 8-K (current event), DEF 14A (proxy), S-1
    (IPO), 13F (institutional holdings), and ~70+ others. License: US Government public domain. The killer
    endpoint for finance and equity-research agents.'
- name: get_research_papers
  description: 'Get recent AI/ML research papers from one of three feeds, chosen with the source argument.
    arxiv_recent is the firehose: newest arXiv submissions in cs.AI / cs.LG / cs.CL / cs.CV by submission
    date, refreshed daily at 11:30 UTC. trending is citation-ranked from Semantic Scholar across five
    fan-out queries, deduped, refreshed daily at 11:00 UTC. hf_daily is Hugging Face editor-curated with
    community upvotes and discussion counts, refreshed daily at 14:15 UTC. Pick arxiv_recent for what
    is brand new, trending for what is influential, hf_daily for what practitioners are discussing. License:
    arXiv and Semantic Scholar permit metadata use; the standard attribution block ships on every response.'
- name: get_agent_opportunities
  description: 'Get TensorFeed''s daily scan of new repositories across the AI agent ecosystem (Anthropic,
    OpenAI, Microsoft, ModelContextProtocol, HuggingFace, LangChain, frontier labs) plus recent MCP/x402/skills
    keyword sweeps. Each opportunity includes the GitHub repo path, description, stars, last update, the
    source signal, and a composite score (signal weight × log10(stars+1) × recency decay). Refreshed daily
    at 13:30 UTC. Useful for surfacing distribution targets, integration ideas, or just a daily digest
    of what''s launching across the agent space. License: GitHub data via the public Search API; output
    is TensorFeed''s curated ranking.'
- name: route_verdict
  description: 'TensorFeed''s signed model-routing decision: the single best model for a task or named
    model, fused from live pricing, contamination-discounted benchmarks, real production usage, measured
    p95 latency, incident state, and deprecation flags, with the reasoning. tier=''preview'' is free (10
    calls per day per IP), top verdict only. tier=''full'' costs 1 credit ($0.02) and adds ranked runners-up,
    constraint filters, and an AFTA-signed receipt you can audit. Omit tier and you get the free preview,
    unless the call carries a payment or credits token (or uses the strict x402 transport), in which case
    it bills as full. Pay per call with an x402 wallet payment (arguments.payment, or an X-PAYMENT header;
    strict HTTP-402 transport at https://mcp.tensorfeed.ai/mcp?x402=strict) or use an Authorization: Bearer
    tf_live_... credits token. No token and no USDC? Claim free trial credits by signing a wallet message
    at https://tensorfeed.ai/api/payment/trial-credits.'
- name: provider_reliability_verdict
  description: 'TensorFeed''s signed dependability ruling over its OWN measured latency and availability
    probes of the frontier AI providers: the single most-dependable provider to build on and the riskiest,
    scoring availability and tail consistency (p50 over p95) equally because an agent retry loop feels
    the tail, not the median. tier=''preview'' is free (10 calls per day per IP), top verdict only. tier=''full''
    costs 1 credit ($0.02) and adds the full per-provider ranking with measured availability and p50/p95/p99
    and tail spread plus an AFTA-signed receipt. Omit tier and you get the free preview, unless the call
    carries a payment or credits token (or uses the strict x402 transport), in which case it bills as
    full. Pay per call with an x402 wallet payment (arguments.payment, or an X-PAYMENT header; strict
    HTTP-402 transport at https://mcp.tensorfeed.ai/mcp?x402=strict) or use an Authorization: Bearer tf_live_...
    credits token. No token and no USDC? Claim free trial credits by signing a wallet message at https://tensorfeed.ai/api/payment/trial-credits.'
- name: x402_settlement_verdict
  description: 'TensorFeed''s signed ruling on the state of the x402 USDC settlement market on Base, computed
    over its OWN on-chain settlement index: market momentum versus the prior window of equal length, concentration,
    and the leading publisher. Covers the publishers TensorFeed indexes on Base, forward-only from launch.
    tier=''preview'' is free (10 calls per day per IP), headline verdict only. tier=''full'' costs 1 credit
    ($0.02) and adds the full per-publisher ranking with volume share, ecosystem totals, the Herfindahl
    concentration index, an optional window, and an AFTA-signed receipt. Omit tier and you get the free
    preview, unless the call carries a payment or credits token (or uses the strict x402 transport), in
    which case it bills as full. Pay per call with an x402 wallet payment (arguments.payment, or an X-PAYMENT
    header; strict HTTP-402 transport at https://mcp.tensorfeed.ai/mcp?x402=strict) or use an Authorization:
    Bearer tf_live_... credits token. No token and no USDC? Claim free trial credits by signing a wallet
    message at https://tensorfeed.ai/api/payment/trial-credits.'
- name: x402_publisher_verdict
  description: 'TensorFeed''s signed trust verdict on one x402 publisher, over its OWN on-chain settlement
    index: whether a named publisher domain is actively settling, recently quiet, registered with no settlement,
    unreachable, missing a Base payTo, or not indexed. Requires a domain. tier=''preview'' is free (10
    calls per day per IP), the trust verdict only. tier=''full'' costs 1 credit ($0.02) and adds the 30-day
    settlement momentum, the shared-wallet risk flag, the settlement evidence (volume, count, last settled),
    and an AFTA-signed receipt. Omit tier and you get the free preview, unless the call carries a payment
    or credits token (or uses the strict x402 transport), in which case it bills as full. Pay per call
    with an x402 wallet payment (arguments.payment, or an X-PAYMENT header; strict HTTP-402 transport
    at https://mcp.tensorfeed.ai/mcp?x402=strict) or use an Authorization: Bearer tf_live_... credits
    token. No token and no USDC? Claim free trial credits by signing a wallet message at https://tensorfeed.ai/api/payment/trial-credits.'
- name: stack_safety_verdict
  description: 'TensorFeed''s deploy gate for an AI software stack: pass each package as comma-separated
    name@version and get the overall BLOCK / HOLD / PASS / UNKNOWN gate plus a per-package verdict, fusing
    the ingested AI-stack CVE batch with the CISA KEV catalog. Conservative by design: BLOCK only on an
    exploited CVE with no fix, HOLD when a known CVE applies and you must verify your version, PASS on
    no match, UNKNOWN outside the curated AI-stack cohort. tier=''preview'' is free (10 calls per day
    per IP), caps at 3 packages, gate plus worst offender. tier=''full'' costs 1 credit ($0.02), raises
    the cap to 10 packages, and adds the matched-CVE evidence (ids, affected ranges, fixed versions, KEV
    status) and an AFTA-signed receipt. Omit tier and you get the free preview, unless the call carries
    a payment or credits token (or uses the strict x402 transport), in which case it bills as full. Pay
    per call with an x402 wallet payment (arguments.payment, or an X-PAYMENT header; strict HTTP-402 transport
    at https://mcp.tensorfeed.ai/mcp?x402=strict) or use an Authorization: Bearer tf_live_... credits
    token. No token and no USDC? Claim free trial credits by signing a wallet message at https://tensorfeed.ai/api/payment/trial-credits.'
- name: benchmark_trust_verdict
  description: 'TensorFeed''s signed ruling on whether an AI benchmark is still a trustworthy capability
    signal or saturated, contaminated, or near ceiling so a high score should be down-weighted: a trust
    band (reliable, use_with_caution, saturated, contaminated, deprecated) and a 0-100 trust score per
    benchmark. Pass benchmark to narrow to one, or category to filter, or neither for the registry. tier=''preview''
    is free (10 calls per day per IP), top verdict and bands only. tier=''full'' costs 1 credit ($0.02)
    and adds the per-signal detail (ceiling proximity, frontier compression, contamination), a down-weight
    recommendation with an alternative benchmark, and an AFTA-signed receipt. Omit tier and you get the
    free preview, unless the call carries a payment or credits token (or uses the strict x402 transport),
    in which case it bills as full. Pay per call with an x402 wallet payment (arguments.payment, or an
    X-PAYMENT header; strict HTTP-402 transport at https://mcp.tensorfeed.ai/mcp?x402=strict) or use an
    Authorization: Bearer tf_live_... credits token. No token and no USDC? Claim free trial credits by
    signing a wallet message at https://tensorfeed.ai/api/payment/trial-credits.'
- name: failover_verdict
  description: 'Provider A is degraded; TensorFeed''s signed ruling on the single best operational provider
    to fail over to for a task right now. Confirms A against the live incident-triage feed, then runs
    the route-verdict fusion with A (and any provider already in failover) excluded. Requires from. tier=''preview''
    is free (10 calls per day per IP), the failover target only. tier=''full'' costs 1 credit ($0.02)
    and adds the full candidate (pricing, measured p95 latency, quality), the ranked alternatives, the
    confirmed incident on A, and an AFTA-signed receipt. Omit tier and you get the free preview, unless
    the call carries a payment or credits token (or uses the strict x402 transport), in which case it
    bills as full. Pay per call with an x402 wallet payment (arguments.payment, or an X-PAYMENT header;
    strict HTTP-402 transport at https://mcp.tensorfeed.ai/mcp?x402=strict) or use an Authorization: Bearer
    tf_live_... credits token. No token and no USDC? Claim free trial credits by signing a wallet message
    at https://tensorfeed.ai/api/payment/trial-credits.'
- name: ssvc_verdict
  description: 'TensorFeed''s signed SSVC patch-urgency decision for one CVE, applying the CISA SSVC Coordinator
